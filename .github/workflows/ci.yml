# CI (T01.10): lint + typecheck + unit + integration (Postgres service) + build.
# Bật "Require status checks to pass" cho nhánh main trên GitHub để CI chặn merge (F01 AC5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xtt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xtt_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/xtt_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xtt_test
      # Khóa giả chỉ dùng trong CI: test ký và đọc cookie xem phân tích cần có khóa.
      AUTH_SECRET: ci-test-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
