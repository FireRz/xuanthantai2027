# Diễn tập khôi phục (T10.4): tải bản sao lưu mới nhất, khôi phục vào Postgres trống,
# so số dòng từng bảng với production (chỉ đọc). Chạy tay: Actions -> Restore drill -> Run workflow.
name: Restore drill

on:
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tải bản sao lưu mới nhất
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_TOKEN }}
        run: node scripts/backup-blob.mjs download backup.dump
      - name: Khôi phục vào DB trống
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --no-privileges --exit-on-error --dbname=postgresql://postgres:postgres@localhost:5432/restore_drill backup.dump
      - name: Đối chiếu với production
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: node scripts/verify-restore.mjs "$BACKUP_DATABASE_URL" postgresql://postgres:postgres@localhost:5432/restore_drill
